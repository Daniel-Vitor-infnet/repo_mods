## Settings file was created by plugin Extraction Button Confirm v1.0.1
## Plugin GUID: com.user.repo.extractionbutton

[General]

## Activa o desactiva el mod. Cuando está activo, las extracciones no se envían automáticamente al alcanzar la cuota, sino hasta presionar el botón de confirmación.
# Setting type: Boolean
# Default value: true
Enabled = true

## Elige qué botón físico usar para confirmar la extracción en niveles normales:
## - Both: Habilita tanto el pedestal de la tienda (shopStation) como el botón de la máquina (Recomendado).
## - ShopPedestalButton: Conserva el pedestal con botón de la tienda (shopStation) al lado del punto de extracción.
## - ExtractionPointButton: Usa únicamente el botón propio de la máquina de extracción.
# Setting type: ConfirmationButtonMode
# Default value: Both
# Acceptable values: ExtractionPointButton, ShopPedestalButton, Both
ButtonMode = Both

