## Settings file was created by plugin 翅膀染色 v1.1.0
## Plugin GUID: xingKong.WingDye

[1. 通用]

## 总开关。
# Setting type: Boolean
# Default value: true
启用 = true

## 即使没有买翅膀升级，也强制把翅膀等级设为 1 以显示/飞行。
# Setting type: Boolean
# Default value: true
强制拥有翅膀 = true

[2. 颜色]

## 翅膀主色（#RRGGBBAA）。例如浅蓝 #59A6FFFF、紫 #B45CFFFF、金 #FFD24AFF。
# Setting type: String
# Default value: #59A6FFFF
翅膀本体颜色 = #59A6FFFF

## 翅膀边缘发光色（#RRGGBBAA），通常比本体更亮。
# Setting type: String
# Default value: #8FD9FFFF
翅膀边缘光颜色 = #8FD9FFFF

## 翅膀自带灯光的颜色（#RRGGBBAA），留空则跟随本体颜色。
# Setting type: String
# Default value: #8FD9FFFF
翅膀灯光颜色 = #8FD9FFFF

[3. 其它]

## 关闭翅膀的循环音效。
# Setting type: Boolean
# Default value: true
静音翅膀循环音 = true

## 定期重新应用颜色，防止被游戏刷新覆盖。
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,1 to 3
重新应用间隔（秒） = 0.5

[4. 联机]

## 通过 Photon 玩家属性同步颜色，装了本模组的队友会看到你的配色。
# Setting type: Boolean
# Default value: true
同步颜色给队友 = true

