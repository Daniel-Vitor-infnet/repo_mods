## 长按判定时长（秒）。按住出售键超过该时长才会真正出售，中途松手即取消。防止误按误卖，默认 0.8。
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0,1 to 5
Hold To Sell Seconds = 0.8

## true = 只在中转站回收（关卡之间的卡车场景，且本轮至少已打完一关；开局大厅与关卡内都不响应）。false = 除商店以外，任何时刻都能在卡车内回收。两种模式都要求你本人站在卡车车厢内。
# Setting type: Boolean
# Default value: true
Only Sell At Intermission = true

## true = 手持物品还必须落在车厢包围盒内才算可售（默认开启，v0.1.2 起）；false = 只要人站在车内且手上有物品就算可售，站在车尾门外按了也可能结算。
# Setting type: Boolean
# Default value: true
Check Truck Box For Held = true

## 出售比例（%），按物品当前价值折算成现金。默认 60 表示按六折回收，100 为全额。
# Setting type: Int32
# Default value: 60
# Acceptable value range: From 1 to 100
Refund Percent = 60

## 车厢定位全失效时的距离兜底半径（米）。仅在既读不到 RoomVolumeCheck、又扫不到任何 Truck 房间盒时启用；正常情况不走这条路径。
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 50
Truck Radius Fallback = 20

## true = 手上拿着道具（ItemAttributes：枪械、医疗包、推车等）时也允许回收变现（v0.1.2 起默认开启，长按只卖手上那一件）；false = 手上是道具就拒绝。
# Setting type: Boolean
# Default value: true
Sell Props = true

## 车厢房间包围盒的单边尺寸上限（米）。超过则判定该 Truck 房间覆盖了整片地图并弃用。实测车厢盒约 14.15m，默认 20。若日志出现 [Truck] 跳过尺寸异常的房间盒，可把它调大到 30。
# Setting type: Single
# Default value: 20
# Acceptable value range: From 8 to 60
Max Truck Box Side = 20

## true = 屏幕底部显示按键提示与出售结果。
# Setting type: Boolean
# Default value: true
Show HUD = true

## 界面语言 / UI language：填 Chinese（或 zh、中文）显示中文；填 English（或 en）显示英文。只影响屏幕提示与读条文字，不影响日志与配置项名。默认 Chinese。
# Setting type: String
# Default value: Chinese
Language = Chinese

## true = 每次按出售键都把判定细节写入 BepInEx 日志（LogOutput.log），便于排查按键无反应的原因。
# Setting type: Boolean
# Default value: true
Debug Log = true

[Multiplayer]

## 主机端开关：true = 允许客机按 G 出售（请求由主机校验并执行）；false = 仅主机可出售。
# Setting type: Boolean
# Default value: true
Allow Client Sell = true

## 网络事件码 100~198。本模组占用 EventCode 与 EventCode+1；若与其他联机模组冲突（表现为客机出售无响应），改成其它数字。
# Setting type: Byte
# Default value: 173
# Acceptable value range: From 100 to 198
Event Code = 173

