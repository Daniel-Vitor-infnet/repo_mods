## On: click the phone with the mouse, and you can't look around until it's away. Off: the phone runs on the keyboard (arrows and Enter), so you can still look around and grab while it's up, and it can come up by itself when you're rung. The lobby screen always uses the mouse.
# Setting type: Boolean
# Default value: true
PhoneUsesMouse = true

## Where the call phone sits: bottom middle (just above your inventory slots), bottom left (just above the info lines there), or bottom right.
# Setting type: PhoneSpot
# Default value: BottomMiddle
# Acceptable values: BottomRight, BottomLeft, BottomMiddle
PhonePosition = BottomMiddle

## The phone's clock in 24-hour time (14:05). Off: 12-hour time (2:05 PM).
# Setting type: Boolean
# Default value: false
PhoneClock24Hour = false

## How you steer the phone and its games. Arrows: the arrow keys and Enter, and W, A, S, D still walk. WASD: W, A, S, D steer, E is Enter, and you stand still while the phone is up. Either way Space is the phone's while it's up (the action key in games) and doesn't jump.
# Setting type: PhoneControlScheme
# Default value: Arrows
# Acceptable values: Arrows, WASD
PhoneControls = Arrows

## The picture on the phone's home screen.
# Setting type: PhoneWallpaper
# Default value: Dusk
# Acceptable values: Dusk, Night, Manor, Plain
PhoneWallpaper = Dusk

## When you host: players with LateJoinPlus may text each other on the phone (you pass the texts on). Off: nobody in your lobby can text. Players without LateJoinPlus never get texts.
# Setting type: Boolean
# Default value: true
AllowTexts = true

## Keep your texts on this PC after you leave a lobby, to read them again later. Off: they're gone when you leave.
# Setting type: Boolean
# Default value: false
KeepTexts = false

## How big the phone is. Large: a fifth bigger, still kept on screen and above your inventory slots.
# Setting type: PhoneSizeChoice
# Default value: Normal
# Acceptable values: Normal, Large
PhoneSize = Normal

## Let people who text you see when you've read their texts ("Read" under their text). Off: they only see Delivered.
# Setting type: Boolean
# Default value: true
SendReadReceipts = true

## When someone rings you, the phone comes up by itself on the caller screen and goes away once the ring is over (not while typing). Enter or your Answer key answers, and your mouse stays with the game; press the phone key to take the phone.
# Setting type: Boolean
# Default value: true
PhoneComesUpWhenRung = true

## Seconds an away notification stays on screen. Press the phone key while it shows to open it. Menus and loading pause the queue.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 2 to 15
NotificationTime = 5

