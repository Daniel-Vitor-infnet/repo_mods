## The language of LateJoinPlus's menu and on-screen panels. auto = the language picked in the game's settings. Logs, this file and lobby chat messages stay in English.
# Setting type: String
# Default value: auto
# Acceptable values: auto, en-US, da-DK, fi-FI, sv-SE, pt-BR, pt-PT, zh-CN, zh-TW
Language = auto

[Late Join]

## Late join on or off (host).
# Setting type: Boolean
# Default value: true
Enabled = true

## Allow joining while everyone is in the truck.
# Setting type: Boolean
# Default value: true
Truck = true

## Allow joining in the shop.
# Setting type: Boolean
# Default value: true
Shop = true

## Allow joining during a level.
# Setting type: Boolean
# Default value: true
Level = true

## Where a late joiner appears: Truck (the level's spawn points) or Host (next to the host, or another living player if the host is dead). Either way the spot is checked for walls, pits, drops, items and extraction areas first. Host setting, applied live.
# Setting type: SpawnLocation
# Default value: Truck
# Acceptable values: Truck, Host
JoinSpawn = Host

## Uncover the rooms already explored on a late joiner's map, also for players without any mods. The game uncovers a room when it sees a player in it, so right after they finish loading, the host briefly shows a player's character in each explored room on the joiner's screen only (about 0.3 s per room). Host setting.
# Setting type: Boolean
# Default value: true
RevealMapForJoiners = true

## Let players who joined mid-level without LateJoinPlus try their inventory slots (once they've finished loading). Off = their items stay in hand until the next level. Their game usually skips setting up its slots in the level they join, so an item they put away vanishes for them. The host only sees that when they put a second item in the same slot: it then drops the first back at their feet and keeps the rest in hand for that level. Host setting, applied live.
# Setting type: Boolean
# Default value: false
TrySlotsForJoinersWithoutMod = false

## Host: the truck's end-of-level heal runs on each player's own game, and some players' games never do it (seen with GameTools). Anyone still not healed a few seconds after the truck's heal opened, while standing in the truck, is healed from your game by the same amount; works for players without mods too. Applied live.
# Setting type: Boolean
# Default value: true
TruckHealBackup = true

## When another late-join mod (LateJoinNow, LateRepo, LateJoin and the like) is installed too, switch it off so only LateJoinPlus handles joining: two late-join mods fight over the same lobby. Off = leave it running (not recommended). Restart the game after changing.
# Setting type: Boolean
# Default value: true
OtherLateJoinMods = true

SlotsForJoinersWithoutMod = true

[Lobby]

## After you confirm Start, the run begins this many seconds later, so everyone can get ready (players with LateJoinPlus see the countdown). Shift-click Start to begin at once; click Start again to call it off. 0 = no countdown. Host setting.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 0 to 300
StartCountdownSeconds = 5

## Show the name colours the host picked (above players, in the lobby list and the pause menu).
# Setting type: Boolean
# Default value: true
ShowNameColors = true

## On a loading screen, after this many seconds of waiting for a player (still on their results screen, or still loading the level), you're told who, and the players panel offers Continue without them (results screen) or Kick (loading). Host setting.
# Setting type: Int32
# Default value: 45
# Acceptable value range: From 10 to 300
WarnSlowPlayersSeconds = 15

## When a level ends, the game waits for every player's game before loading the next one; a player whose game stopped answering keeps everyone waiting (a player still on the results screen counts as not done yet, so keep this generous). After this many seconds the level change continues without them (0 = only when you press Continue in LJ+ menu > Overview). Host setting.
# Setting type: Int32
# Default value: 120
# Acceptable value range: From 0 to 600
ContinueStuckLevelChangeSeconds = 60

## In the public server list, show lobbies running LateJoinPlus first, with the tag in gold.
# Setting type: Boolean
# Default value: true
HighlightLateJoinPlusLobbies = true

[Lobby Guard]

## Lobby Guard on or off: blocks the known lobby-wrecking cheats (fake kicks, host takeover, voice spam), logs every player's Steam ID, and blocks/bans players on your block list. Applied live.
# Setting type: Boolean
# Default value: true
Enabled = true

## Stay in the lobby when someone forcibly makes themselves host while the real host is still there (the game would send everyone to the main menu). As host: take the host role back and ban them.
# Setting type: Boolean
# Default value: true
BlockHostHijack = true

## Block and, as host, ban a player who joins with the name of your moderator, a protected player, a Steam friend or you, from a different Steam account (look-alike letters count). Also a second copy of a player who's here, when only the one already here was seen before. Applied live.
# Setting type: Boolean
# Default value: true
BlockNameCopies = true

## Block voices that try to play through someone else's character, junk voice data (the giant emoji spam), and voice-only intruders who aren't in the game.
# Setting type: Boolean
# Default value: true
VoiceGuard = true

## Lobbies you host publish each player's Steam ID (checked by Photon's Steam login), so fake names and fake Steam IDs can be seen through and logged. LateJoinPlus moderators need this, so it stays on while LateJoinPlus moderation is on. Applies to the next lobby you host.
# Setting type: Boolean
# Default value: true
RevealSteamIds = true

## When you are the host, ban blocked players with the game's own ban (Photon's server removes them; a cheat can't ignore it).
# Setting type: Boolean
# Default value: true
AutoBan = true

## Add the Steam ID of anyone caught doing something a normal game never does to BlockedSteamIds, so they're blocked and banned on sight next time.
# Setting type: Boolean
# Default value: true
AutoAddToBlockList = true

## Steam IDs (17 digits, comma-separated) to add to your Block List. They're moved into the list when the game starts and this is emptied: the list is kept on this PC (LJ+ menu > Block List), not in the mod profile, so sharing a profile code doesn't share it.
# Setting type: String
# Default value: 
BlockedSteamIds = 

## Also block (and as host ban) players caught by the guesswork checks below. Careful: a slow PC that takes over 90 seconds to load can look like a ghost and get banned. Off = those are only logged.
# Setting type: Boolean
# Default value: false
EnforceHeuristics = true

## A player sending more network messages than this per second is flooding.
# Setting type: Int32
# Default value: 500
# Acceptable value range: From 100 to 2000
FloodMessagesPerSecond = 500

## A player sending more data than this (KB a second) for about 3 seconds is flooding. When you host they're banned from this lobby, but not added to your block list. Players normally send about 15 KB a second.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 50 to 1000
FloodKilobytesPerSecond = 100

## Your game ignores chat from one player past 3 messages a second (faster than anyone types), keeps the truck screen's text to a sensible length instead of letting it grow without limit, shortens chat messages over 300 characters, and ignores face expressions that don't exist. A chat-spam cheat froze whole lobbies this way. Normal chat is unchanged. Applied live.
# Setting type: Boolean
# Default value: true
ChatSpamGuard = true

## Maximum messages per RPC name from one player per second after loading settles. Excess messages are ignored; the host is exempt.
# Setting type: Int32
# Default value: 250
# Acceptable value range: From 50 to 2000
RpcMessagesPerSecond = 250

## Host outgoing command backlog to watch. Three seconds of growth with a dominant incoming data flood removes that sender from this lobby.
# Setting type: Int32
# Default value: 1024
# Acceptable value range: From 256 to 8192
OutgoingQueueCommands = 1024

## When you host, don't spawn objects that only exist in another mod, such as RepoCasino's casino. The game sends anyone without that mod back to the menu while a level loads. Turn this off only if everyone in your lobby has the same mods. Applied live.
# Setting type: Boolean
# Default value: true
HoldBackModOnlyObjects = true

## A player in the lobby this long (while a level is running) without ever getting a character is a ghost.
# Setting type: Int32
# Default value: 90
# Acceptable value range: From 30 to 300
GhostSeconds = 90

## In lobbies you host, GameTools switches itself off on everyone else's game (moderators too), as when a host's GameTools has Prohibit Others on. Only when you don't have GameTools yourself: with it, use its own Prohibit Others. Applied live.
# Setting type: Boolean
# Default value: false
LockGameTools = true

## In lobbies you host, only you and moderators you've given Truck & extract can start the truck, press the shop checkout, or press BigFriendlyButton's extraction button (to send or cancel an extraction; also its floor box for players without that mod). Anyone else is refused by your game, so it works on players without mods too (the button says no and they're made to let go). Anyone may still open extraction points. Applied live.
# Setting type: Boolean
# Default value: false
OnlyStaffStart = false

[Map Sync]

## For players who have LateJoinPlus (or Map Sync Fix): as host, send the exact list of rooms explored so far to anyone joining mid-level; when you join someone else's game mid-level, uncover the rooms their host sends. Players without mods get their map filled in by Late Join > RevealMapForJoiners instead, whatever this is set to. Applied live.
# Setting type: Boolean
# Default value: true
Enabled = true

## When you join mid-level and the host doesn't run LateJoinPlus or Map Sync Fix (so it can't send its explored rooms), uncover every room on your map instead. This also shows rooms nobody has explored yet.
# Setting type: Boolean
# Default value: false
RevealAllRoomsWhenHostHasNoMod = false

[Mod conflicts]

## Choose which mod loads when SharePermissions is installed. Ask = choose at the main menu. KeepLateJoinPlus = the other mod does not load. KeepOther (or KeepSharePermissions) = all of LateJoinPlus, including late joining, stays off. Both mods stay installed. Restart the game after changing this.
# Setting type: String
# Default value: Ask
SharePermissions = Ask

## Choose which mod loads when RepoCasino is installed. Ask = choose at the main menu. KeepLateJoinPlus = the other mod does not load. KeepOther (or KeepRepoCasino) = all of LateJoinPlus, including late joining, stays off. Both mods stay installed. Restart the game after changing this.
# Setting type: String
# Default value: Ask
RepoCasino = Ask

[Players]

## Bigger lobbies: this mod sets the max player count (host; players who join need no mod). While on, it takes over from MorePlayers (its patches are switched off) and RoboUnion's player limit. Off = the game's own limit (6). A full lobby disappears from the server list.
# Setting type: Boolean
# Default value: true
MaxPlayersEnabled = true

## Max players, applied live (host). Full = hidden from the server list.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 2 to 20
MaxPlayers = 11

