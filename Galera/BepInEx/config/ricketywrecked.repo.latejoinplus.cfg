## Let players with LateJoinPlus 1.1.0+ ask you for a 1-on-1 with their Call button; you answer with the answer / decline keys. Host setting.
# Setting type: Boolean
# Default value: true
AllowCallRequests = true

## How loud you are for the others on your call, in % (100 = normal). Only the people on your call hear the change.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 50 to 200
CallMicBoost = 100

## Which corner of the screen the call panel is in. The top corners sit below the game's own HUD on that side (under the money and extraction count on the right).
# Setting type: Corner
# Default value: TopRight
# Acceptable values: BottomRight, BottomLeft, TopRight, TopLeft
CallPanelCorner = TopRight

## Play a short sound when someone rings you or asks you for a call.
# Setting type: Boolean
# Default value: true
RingSound = true

[Debug]

## Write every step to the log, for bug reports. Applied live.
# Setting type: Boolean
# Default value: false
DebugLogging = false

[Display]

## Show each late joiner's progress (Connecting / Loading / Joined) and anyone leaving (Left) bottom-left. [O] / [X] = with / without LateJoinPlus.
# Setting type: Boolean
# Default value: true
ShowJoinStatus = true

## On loading screens (where no menu opens), the host and moderators who may remove players see everyone in the lobby: still on the results screen, loading or loaded, with Kick / Ban / Block (click twice). The host can also continue a stuck level change from there.
# Setting type: Boolean
# Default value: true
LoadingScreenPlayers = true

## Pop-ups above your inventory slots when a moderator acts in your lobby (kick, ban, block, notes, Admin, run control, moderator changes). Moderators also see the host's actions and each other's.
# Setting type: Boolean
# Default value: true
ShowModeratorActions = true

## Show the player count, room type, Open/Closed state and room name bottom-left, for the host and moderators.
# Setting type: Boolean
# Default value: true
ShowStatus = true

## When you join someone else's lobby mid-level and their late-join mod didn't send some of the level's rooms (no floors or walls there), say so on screen. They load properly after the next level.
# Setting type: Boolean
# Default value: true
MissingRoomWarning = true

## Add an INVITE button (Steam invite overlay) to the pause menu while joining is allowed.
# Setting type: Boolean
# Default value: true
InviteButton = true

## A small 'LJ+ [F6]' bottom-left (with your Menu Key) as a reminder of the key that opens the LJ+ menu, while it opens something for you (host, moderators, and players who can use calls); with 'ADMIN [F8]' beside it while you may use the Admin page, and 'PHONE [Home]' for the call phone.
# Setting type: Boolean
# Default value: true
ShowMenuKeyHint = true

