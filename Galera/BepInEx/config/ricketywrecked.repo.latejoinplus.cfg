## Settings file was created by plugin LateJoinPlus v1.2.2
## Plugin GUID: ricketywrecked.repo.latejoinplus

[Admin]

## Most things a moderator can spawn at once on the Admin page (the host up to 10; enemies 3 at most).
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 10
ModeratorSpawnMax = 5

## Moderators allowed Admin may also send everyone to another level or the shop.
# Setting type: Boolean
# Default value: true
ModeratorsMayChangeLevel = true

[Bug reports]

## After LateJoinPlus hits an error, suggest sending a bug report.
# Setting type: Boolean
# Default value: true
OfferAfterError = true

## Show Send bug report in the LJ+ menu.
# Setting type: Boolean
# Default value: true
Enabled = true

## Where bug reports go. Leave as it is.
# Setting type: String
# Default value: https://ljp-reports.ricketywrecked.workers.dev/report
RelayUrl = https://ljp-reports.ricketywrecked.workers.dev/report

[Calls]

## Longest a call started by a moderator may run, in minutes (0 = no limit). Your own calls are never limited. Host setting.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 30
MaxCallMinutes = 0

## After a call a moderator started ends, how long before they can start another, in minutes (0 = none). Host setting.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 30
MinutesBetweenCalls = 0

## How loud the others on your call are for you, in % (100 = normal).
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 20 to 300
CallVolumePercent = 100

## While you're on a call, how loud players who aren't on it are for you, in % (0 = only the call, 100 = as loud as normal). Change it any time, also during a call (LJ+ menu > Calls).
# Setting type: Int32
# Default value: 15
# Acceptable value range: From 0 to 100
OutsideCallVolume = 15

## Show who's on your call (and who's talking) while you're on one, in the corner Call Panel Corner picks (top right by default).
# Setting type: Boolean
# Default value: true
ShowCallPanel = true

