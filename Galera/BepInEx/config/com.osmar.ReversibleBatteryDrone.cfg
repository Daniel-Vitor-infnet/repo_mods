## Settings file was created by plugin ReversibleBatteryDrone v1.0.4
## Plugin GUID: com.osmar.ReversibleBatteryDrone

[General]

## Enable or disable the ReversibleBatteryDrone mod entirely.
# Setting type: Boolean
# Default value: true
Enabled = true

## Logs the measured Drain Mode charge rate once per second (measured vs. expected %/s). For diagnostics only.
# Setting type: Boolean
# Default value: false
DebugLogging = false

[ItemSiphoning]

## Percentage of battery (1% to 100%) drained from the targeted item per second and transferred directly into the drone's battery. At 5% (default, matches game's native recharge rate), an item with 100% battery drains in 20 seconds. Can be set up to 100% for instant 1-second drain.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 100
TargetBatteryDrainPercentPerSecond = 5

[LifeLeech]

## Flat health points (HP) of damage dealt to the targeted monster on every tick (1 to 100 HP).
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 100
MonsterDamageFlatHpPerTick = 1

## Flat health points (HP) of damage dealt to the targeted player/teammate on every tick (1 to 100 HP).
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 100
PlayerDamageFlatHpPerTick = 10

## Percentage of battery charge (1% to 100%) added to the drone on every tick while leeching life from a monster or player.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 100
DroneBatteryGainPercentPerTick = 1

## Time in seconds between each damage and battery gain tick when leeching life from a living target (0.1s to 5.0s).
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,1 to 5
LeechTickIntervalSeconds = 0.5

## Whether the drone in Drain mode is allowed to latch onto monsters and leech their health.
# Setting type: Boolean
# Default value: true
AllowTargetingMonsters = true

## Whether the drone in Drain mode is allowed to latch onto other players and leech their health (PvP friendly-fire toggle).
# Setting type: Boolean
# Default value: true
AllowTargetingPlayers = true

## Whether attaching the drone in Drain mode to an enemy alerts them and initiates a direct chase toward the player.
# Setting type: Boolean
# Default value: true
AlertEnemyOnAttach = true

## Whether detaching the drone in Drain mode from an enemy alerts them and initiates a direct chase toward the player.
# Setting type: Boolean
# Default value: true
AlertEnemyOnDetach = true

## Maximum distance in meters (1 to 20 meters, integer) between the player and the enemy for the enemy to detect and chase the player on attach/detach. If no player is within this range, or if the drone detaches naturally on full battery, the enemy is not alerted.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 20
AlertEnemyDetectionRange = 6

