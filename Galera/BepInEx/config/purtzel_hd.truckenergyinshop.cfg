## Settings file was created by plugin TruckEnergyInShop v1.0.1
## Plugin GUID: purtzel_hd.truckenergyinshop

[General]

## Crystal marks on the truck energy bar in the shop. Lines = lines through the bar, Arrows = arrows above and below the bar, Both = lines and arrows, Off = no marks.
# Setting type: MarkStyle
# Default value: Both
# Acceptable values: Off, Lines, Arrows, Both
Mark Style = Both

## Show over the bar how many Power Crystals are in the truck after the shop, out of a full bar ("4/10 crystals").
# Setting type: Boolean
# Default value: true
Show Crystal Count = true

## Color of the bar for the Power Crystals you buy in this shop. Default = no own color (yellow like the rest).
# Setting type: CrystalColor
# Default value: Orange
# Acceptable values: Default, Orange, Pink, Green, Brown, Red, LightGreen, Turquoise, LightBlue, DarkBlue, Purple, Magenta, LightPink
Purchased Crystal Color = Orange

## Size of the lines and arrows in percent (50 - 200).
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 50 to 200
Mark Size = 100

## Size of the crystal count text over the bar in percent (50 - 200).
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 50 to 200
Text Size = 100

## Also show the crystal marks and the crystal count on the truck outside the shop (for example in a level).
# Setting type: Boolean
# Default value: false
Show Outside Shop = false

