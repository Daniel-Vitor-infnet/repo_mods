## Settings file was created by plugin BigFriendlyButton v1.0.2
## Plugin GUID: Vippy.BigFriendlyButton

[Button]

## Turn it off and extraction goes back to vanilla on the spot, the haul goes the second you hit the goal. Joining someone with Zehs button still works either way.
# Setting type: Boolean
# Default value: true
Enabled = true

## Only the host can send the haul or call it off. Everyone elses button stays dark. Turns itself off while the host is dead so the haul can't get stuck.
# Setting type: Boolean
# Default value: false
Only host can press = true

## Hit the button again before the extraction goes to call it off. Nothing on the pad goes anywhere.
# Setting type: Boolean
# Default value: true
Press again to cancel = true

## Lets a press send the haul before it reaches the goal. Whatever it was short gets added to the next extraction point's goal. On the last point of a level its just gone.
# Setting type: Boolean
# Default value: false
Send early = false

## Seconds at the goal before it goes on its own. 0 = never, it waits for a press.
# Setting type: Int32
# Default value: 0
# Acceptable value range: From 0 to 300
Auto extract after = 0

## A bar on the stand that fills as you get closer to being able to press. Just your screen. With Enabled off it moves to the extraction screen and shows the haul against the goal.
# Setting type: Boolean
# Default value: true
Progress bar = true

## Host only. Shows you what people without the mod get (the flat box) instead of the shop button, so you can try it solo.
# Setting type: Boolean
# Default value: false
Preview the no-mod button = false

