## Settings file was created by plugin Extra Inventory Slots v1.2.1
## Plugin GUID: DarkSpider90.ExtraInventorySlots

[Controls]

## If on, the numpad numbers work for the extra slots as well as the number row.
# Setting type: Boolean
# Default value: true
Numpad Keys For Extra Slots = true

[Multiplayer]

## If on, nobody in your lobby can use more slots than you have set, even if they configured more for themselves. Only matters when you are the host.
# Setting type: Boolean
# Default value: true
Limit Clients To Host Slot Count = true

[Slots]

## How many inventory slots you have in total. The game gives you 3. A change takes effect on the next level.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 3 to 10
Inventory Slot Count = 5

## If on, nobody keeps what they were carrying when a level ends. Every item is left in the truck for the group to pick up again, instead of going back to whoever held it.
# Setting type: Boolean
# Default value: false
Empty Inventories Between Levels = false

## If on, putting a held item into a slot that is already full swaps the two: the item in the slot comes out and the one you are holding goes in. If off, the slot simply refuses.
# Setting type: Boolean
# Default value: true
Swap With Item In Full Slot = true

