## Settings file was created by plugin Unremove v0.6.0
## Plugin GUID: Eugene8388608.Unremove

[General]

## As of R.E.P.O v0.5.2 just adds single Walkie Talkies in the shop.
## This mod pairs each of them to itself after first use,
## which looks odd actually.
## !!! Game restart is required after changing this option !!!
# Setting type: Boolean
# Default value: true
AddTechnicallyDisabledItems = true

## Whether or not to add the Throw Upgrade shop item.
## Please note that players without this mod will see the Upgrade box,
## but they won't be able to grab or use it. They also won't see it being
## carried away by you, i.e. they won't see the new position of the box.
## !!! Game restart is required after changing this option !!!
# Setting type: Boolean
# Default value: false
ThrowUpgradeBox = true

## Whether or not to add the Hidey Box shop item.
## This is literally a blocky box with a cutout for eyes.
## !!! Game restart is required after changing this option !!!
# Setting type: Boolean
# Default value: false
AddHideyBox = true

## Whether or not to add the Big C.A.R.T.
## !!! Game restart is required after changing this option !!!
# Setting type: Boolean
# Default value: false
AddBigCart = true

## Whether or not to add the Start Room - Manor - TV Room.
## Disabled by default because it doesn't have an extraction point.
## !!! Game restart is required after changing this option !!!
# Setting type: Boolean
# Default value: false
AddManorTVStartRoom = true

## Weird immortal yet harmless copy of Mentalist who doesn't
## attack. It does spawn scary popups around you.
## Restart is not required if changed through REPOConfig mod.
## Singleplayer only because its main attraction (The Popups)
## cannot be instantiated over Photon.
# Setting type: Boolean
# Default value: false
AddEnemyVirus = true

## Debug Command Handler incorrectly registers vanilla debug modules.
## An easy fix but you can disable it in case of problems.
## !!! Game restart is required after changing this option !!!
# Setting type: Boolean
# Default value: true
FixVanillaDebugModules = true

## Log objects that are being unremoved.
# Setting type: Boolean
# Default value: false
LogAddedPrefabRefs = false

