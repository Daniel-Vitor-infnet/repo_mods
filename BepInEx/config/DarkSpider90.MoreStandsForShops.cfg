## Settings file was created by plugin MoreStandsForShops v1.3.2
## Plugin GUID: DarkSpider90.MoreStandsForShops

[General]

## Enable or disable the entire mod.
# Setting type: Boolean
# Default value: true
Enable Mod = true

## Spawn a second upgrade stand in the shop.
# Setting type: Boolean
# Default value: true
Enable Additional Upgrade Stand = true

## Move grenades to the lower health shelf and give vanilla table places safe adaptive item-size slots.
# Setting type: Boolean
# Default value: true
Enable Vanilla Shelf Table Rewrite = true

## Attempt the complete configured current-shop pool instead of applying vanilla's accumulated purchase-based pool limit.
# Setting type: Boolean
# Default value: true
Disable Shop Pool Limit = true

## Refuse requests from other mods to rebuild the game's item catalogue in the middle of a run. Such a rebuild drops every modded item, which is why modded shop purchases stop arriving in the truck.
# Setting type: Boolean
# Default value: true
Keep Item Catalogue Intact = true

## Hand over every copy of an item that was paid for. The game otherwise caps a delivery at the number of copies it expects you to be able to buy - one gun, three grenades - and drops the rest without refunding them.
# Setting type: Boolean
# Default value: true
Deliver Every Purchased Copy = true

## Use the free space inside the truck when the group buys more items of one size than the truck has places for, so nothing is left behind on the way to the level.
# Setting type: Boolean
# Default value: true
Deliver Every Purchased Item = true

## Enable detailed debug logging for troubleshooting.
# Setting type: Boolean
# Default value: false
Debug Logs = false

