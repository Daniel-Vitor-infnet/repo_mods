## Settings file was created by plugin ChargingStationTuning v1.0.0
## Plugin GUID: DarkSpider90.ChargingStationTuning

[Charging]

## How much truck energy charging your gear costs, as a share of what the game charges. 1.00 is exactly vanilla, 0.50 is half the energy for the same charge, 2.00 is twice as much. This is the setting the mod exists for.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0,05 to 20
Energy Cost Multiplier = 0.5

[General]

## Turn the whole mod off without uninstalling it.
# Setting type: Boolean
# Default value: true
Enable Mod = true

## Write a line to the log for every change the mod makes.
# Setting type: Boolean
# Default value: false
Debug Logs = false

[Shop]

## What an energy crystal costs in the shop, as a share of the normal price. 1.00 leaves the price alone. Raise it if you want to pay for the cheaper charging rather than get it free.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,1 to 10
Crystal Price Multiplier = 1

