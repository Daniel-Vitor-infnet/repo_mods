## Settings file was created by plugin R.E.P.O Fixes+ v1.3.10
## Plugin GUID: ricketywrecked.repo.fixes

[Fixes]

## Fixes the KeyNotFoundException spam and stutter when a player joins mid-match, or an enemy spawns after they joined. Restart the game after changing.
# Setting type: Boolean
# Default value: true
EnemyTrackerFix = true

## Stops the NullReferenceException log spam from the grab beam and player eye-tracking when a grabbed object is destroyed. Restart the game after changing.
# Setting type: Boolean
# Default value: true
GrabBeamAntispam = true

## Makes your own grab beam turn on and off instantly in multiplayer instead of waiting on a network round-trip. Restart the game after changing.
# Setting type: Boolean
# Default value: true
InstantGrabBeam = true

## Stops the revive item getting stuck (and spamming errors every frame) when the dead player it locked onto leaves the game. Restart the game after changing.
# Setting type: Boolean
# Default value: true
ReviveItemFix = true

## When joining a lobby from the server list fails with "Game closed" or "Game full" (late-join hosts close their room for a few seconds while a level loads), retry the same lobby every 5 seconds, up to 4 times, instead of going back to the main menu. Restart the game after changing.
# Setting type: Boolean
# Default value: true
ServerListJoinRetry = true

## Stops error spam from game code that keeps running for a moment after a level is torn down (currently: the room lighting and fog right after you leave a match or get kicked), and from a player avatar that never finished setting up, which otherwise throws an error every frame (seen when someone in the lobby is on a different game version). Also lets the spectator camera clean up properly when you are revived, so the rest of the revive is not skipped. Restart the game after changing.
# Setting type: Boolean
# Default value: true
LevelTeardownErrorGuards = true

## Stops a Tumbler freezing mid-chase (and throwing an error every frame) when the player it chases leaves the game (host), a Slow Walker (Trudge) getting stuck mid-attack and throwing an error every frame when a player in its vacuum range leaves or is cleaned up, and a Spewer's mouth staying stuck on a player (throwing an error every frame) after the level changes mid-attack. Restart the game after changing.
# Setting type: Boolean
# Default value: true
EnemyAttackFix = true

## Skips wasted work in other mods, only if they're installed: CartSpeedSync pushing velocity onto carts this machine doesn't simulate (log spam that grows with level); GameTools re-sending its Prohibit Others room setting every 3 seconds when it hasn't changed, and GameTools letting any player remotely kill/revive/heal you (now only the host can, and a kill + revive at the same time, which loops, is ignored), and GameTools reviving heads at an extraction point while the extraction is running (the tube then killed them again, and the game's own revive at the end missed them); CrouchAndCrawlSprint running while the level loads; Toggle Mute's MUTED indicator missing; Hauler Unlimited Storage destroying non-valuables; and XH DamageShow & EnemyHealthBar's welcome popup. Restart the game after changing.
# Setting type: Boolean
# Default value: true
OtherModGuards = true

## Requires Toggle Mute. On: its red MUTED text is fixed so it shows up. Off: the MUTED text isn't made at all (and Toggle Mute's "Could not find text to clone" error goes away); the mute toggle itself still works. Restart the game after changing.
# Setting type: Boolean
# Default value: true
ToggleMuteShowIndicator = true

## How long a network hiccup can last before Photon disconnects you (the game's default is 10). Raising it keeps short Wi-Fi/internet blips from kicking you out of a lobby - including your own. Only affects your own connection. Set to 10 to keep the game's default. Restart the game after changing.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 10 to 60
ConnectionTimeoutSeconds = 30

## For mods that add inventory slots (e.g. ExtraSlots): the game only remembers slots 1-3 between levels, so items in slot 4+ end up loose in the truck. This remembers the extra slots too and puts those items back. Only matters on the host. Restart the game after changing.
# Setting type: Boolean
# Default value: true
ExtraSlotsKeepItems = true

## Requires Empress Gameboy Emulator. Pauses the host's Game Boy when nobody is at the controls instead of emulating and streaming its screen to every player all session. Resumes exactly where it left off when someone presses E. Does nothing if that mod isn't installed. Restart the game after changing.
# Setting type: Boolean
# Default value: true
GameboyPauseWhenIdle = true

## Host only. Items spawned by a mod (e.g. Repo Admin Menu's spawn menu) count as owned, like shop items: they come back in the truck next level and no longer take over items players already have in their slots. Restart the game after changing.
# Setting type: Boolean
# Default value: true
SpawnedItemsKeep = true

## Host only, with NoItemSpawnLimit. When there are more bought items than the truck has spots for, NoItemSpawnLimit puts the extras next to a spawn point, which can be outside the truck or inside a wall. They are put on top of spots in the truck instead. Restart the game after changing.
# Setting type: Boolean
# Default value: true
TruckItemsKeep = true

## Host only. Stops a softlock where no extraction point can be opened: a player who joins mid-level can make the host restart an extraction point that's already finished (their game auto-presses the nearest point when they first see someone outside the truck), which locks every other point for the rest of the level. The host now only starts a point that is unlocked and ready. Works for players without the mod. Restart the game after changing.
# Setting type: Boolean
# Default value: true
ExtractionSoftlockFix = true

## Fixes a player's voice going silent for you alone (everyone else still hears them) until they leave and rejoin. It happens when their game restarts its voice stream and the new stream reaches you before the old one ends. The new stream now replaces the old one, and if someone is talking but nothing plays for 4 seconds, their voice is re-linked. Only changes what you hear; works whatever mods the other player has. Restart the game after changing.
# Setting type: Boolean
# Default value: true
StuckVoiceFix = true

## Fixes nobody hearing you after you drop out of a lobby and rejoin without restarting the game (you can still hear everyone). Your old voice chat object from before you dropped out could stay loaded and keep your microphone tied to your old connection; it is now thrown away so a fresh one is used. Also: when another player's voice object reaches you twice (their old copy or a resend), the game threw both copies away, so you couldn't hear them and their character errored every frame; the new copy is now kept and their character relinked. And when your voice chat connection drops and reconnects by itself (for example after the game was in the background), your microphone is restarted, which fixes nobody hearing you until you switched microphones. Only changes your own machine; works whatever the host has. Restart the game after changing.
# Setting type: Boolean
# Default value: true
RejoinVoiceFix = true

## In the pause menu, clicking a player's Steam profile button no longer turns their voice up to 200%. The game's volume slider reacted to the mouse a little past its end, where the profile button sits. Only changes your own menu. Restart the game after changing.
# Setting type: Boolean
# Default value: true
ProfileButtonVolumeFix = true

## Inventory slots added by a mod like ExtraSlots show their own number and sit in one even row. Since v0.5.0 the game's key labels put the third slot's 3 back on all of them, and its layout only spaced its own three slots. Only changes your own screen. Restart the game after changing.
# Setting type: Boolean
# Default value: true
ExtraSlotLabelFix = true

## Stops a voice chat error from crashing the game. Photon Voice (the game's voice chat) builds some of its log lines in a way that throws a second error when the first one's text contains { or }; on a voice's decode thread nothing catches that, which can close the game. Those lines are now written safely, so the real voice error shows in the log instead. Only changes logging. Restart the game after changing.
# Setting type: Boolean
# Default value: true
VoiceLogCrashFix = true

## Your game sends at most 10 pupil-size messages a second. When two eye effects are active at once (a tranquilizer dart, the gumball, the time glass, the ceiling eye, a walkie-talkie), the game can send one every frame to every player, which can trip a host's flood protection. Pupils look the same for everyone, at most a tenth of a second later. Only changes what your own game sends. Restart the game after changing.
# Setting type: Boolean
# Default value: true
PupilSizeMessageLimit = true

LateJoinNowEquippedItemFix = true

LateJoinNowVoiceFix = true

LateJoinNowPrivateLobbyFix = true

[Performance]

## Hides Unity's "Setting linear/angular velocity of a kinematic body is not supported" warnings. Cosmetics (hair and outfit pieces) trigger them constantly; they change nothing in game but fill the log with thousands of lines. Restart the game after changing.
# Setting type: Boolean
# Default value: true
HideKinematicVelocityWarnings = true

## Stops Unity capturing a full stack trace every time the game or a mod writes an ordinary log line or warning. That capture allocates memory on every call and is a common source of garbage-collection stutter in heavily modded games. Errors keep their stack traces, so crash logs stay just as useful. Restart the game after changing.
# Setting type: Boolean
# Default value: true
NoStackTracesOnInfoAndWarnings = true

