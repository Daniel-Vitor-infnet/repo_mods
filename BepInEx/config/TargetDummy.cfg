## Settings file was created by plugin TargetDummy v1.0.0
## Plugin GUID: TargetDummy

[Ally Dummy]

## Spawn the Ally Dummy: a player droid on a stand, on the other side of the gacha machine. It counts as a teammate: friendly fire hurts it and healing (e.g. HatterWeaponsPack's Healing Wand) heals it. Its health never drops below 1.
# Setting type: Boolean
# Default value: true
Enabled = true

## Its maximum health.
# Setting type: Int32
# Default value: 1000
# Acceptable value range: From 2 to 100000
MaxHealth = 1000

## Health it starts with (capped at MaxHealth). Lower it to test healing straight away.
# Setting type: Int32
# Default value: 1000
# Acceptable value range: From 1 to 100000
StartHealth = 1000

## Return to StartHealth after this many seconds without being hurt or healed (0 = never).
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 600
ResetAfterSeconds = 0

## Height of the whole Ally Dummy in metres, stand included.
# Setting type: Single
# Default value: 2.5
# Acceptable value range: From 1,5 to 4
TotalHeight = 2.5

## Height of the droid on the stand in metres. Its feet hang at TotalHeight - DroidHeight.
# Setting type: Single
# Default value: 1.6
# Acceptable value range: From 0,6 to 3,5
DroidHeight = 1.6

## Where the arm crossbar sits, as a fraction of the droid's height from its feet.
# Setting type: Single
# Default value: 0.62
# Acceptable value range: From 0,3 to 0,95
CrossbarHeight = 0.62

## Turns only the droid on the stand, in degrees, in case it faces the wrong way.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -180 to 180
DroidYaw = 0

## Comma-separated names (or parts of names) of droid pieces to hide. The names are listed in LogOutput.log (LogRobeParts lists both models).
# Setting type: String
# Default value: 
HideDroidParts = 

## Show a health bar with its health over its head.
# Setting type: Boolean
# Default value: true
HealthBar = true

[Model]

## Height of the whole dummy in metres, stand included.
# Setting type: Single
# Default value: 2.6
# Acceptable value range: From 1,5 to 4
TotalHeight = 2.6

## Height of the Robe on the stand in metres. Its hem sits at TotalHeight - RobeHeight.
# Setting type: Single
# Default value: 1.9
# Acceptable value range: From 0,8 to 3,5
RobeHeight = 1.9

## Where the arm crossbar sits, as a fraction of the Robe's height from its hem (0.72 is about the shoulders).
# Setting type: Single
# Default value: 0.72
# Acceptable value range: From 0,3 to 0,95
CrossbarHeight = 0.72

## Turns only the Robe on the stand, in degrees, in case it faces the wrong way.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -180 to 180
RobeYaw = 0

## Comma-separated names (or parts of names) of Robe pieces to hide, if an odd piece shows up. Turn on LogRobeParts to list the names in LogOutput.log.
# Setting type: String
# Default value: 
HideRobeParts = 

## List the visible pieces of the Robe and the droid in LogOutput.log when each dummy is first built.
# Setting type: Boolean
# Default value: true
LogRobeParts = true

## Write every hit, heal and placement decision to LogOutput.log (handy while testing; turn off later).
# Setting type: Boolean
# Default value: true
DebugLog = true

[Numbers]

## Show the damage after the Robe's own damage resistance, i.e. what a real Robe would lose. False shows the raw damage.
# Setting type: Boolean
# Default value: true
ApplyRobeResistance = true

## Show knockback, torque, stun and impact values under the damage.
# Setting type: Boolean
# Default value: true
ShowForce = true

## Show a running total above the dummy. It resets after 3 seconds without a hit.
# Setting type: Boolean
# Default value: true
ShowTotal = true

## Size of the numbers.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0,3 to 4
NumberSize = 1

## Seconds each number stays up.
# Setting type: Single
# Default value: 4.4
# Acceptable value range: From 0,3 to 15
NumberLifetime = 4.4

## Draw the numbers on top of everything so the dummy never hides them.
# Setting type: Boolean
# Default value: true
NumbersThroughWalls = true

## How much the dummy rocks when hit (0 = rigid). Only the looks move; it never actually shifts.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 3
Wobble = 1

[Placement]

## Spawn the target dummy.
# Setting type: Boolean
# Default value: true
Enabled = true

## Only spawn it in the shop (set false to spawn it wherever the cosmetics gacha machine is).
# Setting type: Boolean
# Default value: true
OnlyInShop = true

## Search around the gacha machine for the clear spot nearest the ideal one (floor, no walls, room for the stand). Set false to use the ideal spot exactly, even if it's tight.
# Setting type: Boolean
# Default value: true
AutoPlace = true

## Put the Target Dummy on the machine's right side (seen from the front) and the Ally Dummy on its left. False swaps them.
# Setting type: Boolean
# Default value: true
PreferRightSide = true

## Ideal gap in metres between the side of the gacha machine and the dummy's centre.
# Setting type: Single
# Default value: 1.3
# Acceptable value range: From 0,5 to 8
SideGap = 1.3

## Ideal distance in metres in front of the machine's centre (negative = further back).
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From -4 to 8
ForwardOffset = 0.3

## Extra turn in degrees. By default the dummy faces the same way as the machine's front.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -180 to 180
ExtraYaw = 0

